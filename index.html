<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>WebXR Prototype</title>

  <link rel="stylesheet" href="styles/main.css">

<!-- A-Frame and the matching Three.js addon module graph -->
<script type="importmap">
  {
    "imports": {
      "aframe": "https://aframe.io/releases/1.7.1/aframe.module.min.js",
      "three": "https://cdn.jsdelivr.net/npm/super-three@0.173.0/build/three.module.min.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/super-three@0.173.0/examples/jsm/"
    }
  }
</script>

<!-- Ammo.js -->
<script src="https://cdn.jsdelivr.net/npm/ammo.js@0.0.10/ammo.js"></script>

<style>
  /*
  body {
    filter: brightness(100%) contrast(120%) saturate(40%) blur(4px);
  }
  */
</style>

</head>
<body>
  <a-scene
    vr-mode-ui="enabled: true"
    background="color: #20252b"
    renderer="
      antialias: true;
      colorManagement: true;
      shadowMapEnabled: true;
    "
  >

    <!-- Assets -->

    <a-assets>
      <a-asset-item
        id="vr-hand-right"
        src="models/vr-hand-right.glb"
      ></a-asset-item>
    </a-assets>

    <!-- Lighting -->
    <a-entity
      light="
        type: ambient;
        color: #ffffff;
        intensity: 1.5;
      "
    ></a-entity>

    <a-entity
      light="
        type: directional;
        color: #ffffff;
        intensity: 2;
        castShadow: true;
        shadowMapWidth: 1024;
        shadowMapHeight: 1024;
      "
      position="3 5 2"
    ></a-entity>

    <!-- Ground -->
    <a-plane
      position="0 0 0"
      rotation="-90 0 0"
      width="10"
      height="10"
      color="#555555"
      shadow="receive: true"
    ></a-plane>

    <!-- Player -->
    <a-entity
      id="player"
      position="0 0 0"
    >

      <!-- Desktop / VR Camera -->
      <a-entity
        id="camera"
        camera="
          active: true;
          fov: 75;
        "
        position="0 1.6 0"
        look-controls="
          enabled: true;
          pointerLockEnabled: true;
        "
      ></a-entity>


      <!-- Left VR Controller -->

      <a-entity
        id="left-controller"
        oculus-touch-controls="hand: left; model: false;"
      ></a-entity>

      <!-- Right VR Controller -->
      <a-entity
        id="right-controller"
        oculus-touch-controls="hand: right; model: false;"
      ></a-entity>
    </a-entity>

  </a-scene>

  <script type="module">
    import AFRAME from 'aframe';
    import * as THREE from 'three';

    window.AFRAME = AFRAME;
    window.THREE = THREE;

    await import('./js/refractor-bridge.js');
    await import('./js/materials.js');

    const scripts = [
      'js/desktop-controls.js',
      'js/main.js',
      'js/physics.js',
      'js/abilities.js'
    ];

    for (const source of scripts) {
      await new Promise((resolve, reject) => {
        const script = document.createElement('script');

        script.src = source;
        script.onload = resolve;
        script.onerror = reject;

        document.body.appendChild(script);
      });
    }

    const scene = document.querySelector('a-scene');
    const player = document.querySelector('#player');
    const leftController = document.querySelector('#left-controller');
    const rightController = document.querySelector('#right-controller');

    scene.setAttribute('physics-manager', '');
    scene.setAttribute('casting-system', 'hand: right');

    player.setAttribute('vr-locomotion', '');
    player.setAttribute(
      'desktop-controls',
      'enabled: true; moveSpeed: 3;'
    );

    leftController.setAttribute(
      'vr-hand',
      'hand: left'
    );

    rightController.setAttribute(
      'vr-hand',
      'hand: right'
    );
  </script>

</body>
</html>
