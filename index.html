<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Test</title>
  <!-- <base href="/WebXR-Prototype/"> -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: rgb(32, 36, 48);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <a-scene physics>
    <a-assets>
      <a-asset-item
        id="right-hand-model"
        src="./models/vr-hand-right.glb">
      </a-asset-item>
      <a-asset-item
      id="left-hand-model"
      src="./models/vr-hand-left.glb">
    </a-asset-item>
    </a-assets>
  
    <a-camera position="0 1.6 0"></a-camera>

<!-- Left controller -->
<a-entity
  id="left-controller"
  meta-touch-controls="hand: left; model: true;"
  laser-controls
  raycaster="objects: .interactive"
  line="color: #00ffff; opacity: 0.75"
  tracked-controls
  sphere-collider
  grab
  throw>

  <a-entity
  id="left-hand"
  gltf-model="#left-hand-model"
  position="-0.02 0.03 0.03"
  rotation="180 0 110"
  scale="0.85 0.85 0.85"
  finger-grip="controller: #left-controller">
</a-entity>

</a-entity>

<!-- Right controller -->
<a-entity
  id="right-controller"
  meta-touch-controls="hand: right; model: true;"
  laser-controls
  raycaster="objects: .interactive"
  line="color: #00ffff; opacity: 0.75"
  tracked-controls
  sphere-collider
  grab
  throw>

  <a-entity
  id="right-hand"
  gltf-model="#right-hand-model"
  position="0.02 0.03 0.03"
  rotation="0 0 -70"
  scale="0.85 0.85 0.85"
  finger-grip="controller: #right-controller">
</a-entity>

</a-entity>


<!-- Interactable Ball -->

  <a-sphere
    position="0 2 -4"
    radius="0.5"
    color="red"
    dynamic-body="shape: sphere">
  </a-sphere>

</a-scene>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
