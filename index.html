<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Test</title>
  <!-- <base href="/WebXR-Prototype/"> -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: rgb(32, 36, 48);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <a-scene>

    <a-assets>
      <a-asset-item
        id="right-hand-model"
        src="./models/vr-hand-right.glb">
      </a-asset-item>
    </a-assets>
  
    <a-camera position="0 1.6 0"></a-camera>
  
    <a-entity
      gltf-model="#right-hand-model"
      position="0 1.5 -1">
    </a-entity>
  
  </a-scene>
</body>
</html>
