<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VR Test</title>
  <!-- <base href="/WebXR-Prototype/"> -->
  <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.6.0/dist/aframe-extras.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
<script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.module.js",
      "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.webgpu.js",
      "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.179.0/build/three.tsl.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.179.0/examples/jsm/"
    }
  }
  </script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background-color: rgb(32, 36, 48);
    }

    #c {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>

<body>
  <a-scene
  physics
  shadow="type: pcf">

    <a-assets>
      <a-asset-item
        id="right-hand-model"
        src="./models/vr-hand-right.glb">
      </a-asset-item>
      <a-asset-item
      id="left-hand-model"
      src="./models/vr-hand-left.glb">
    </a-asset-item>
    </a-assets>
  
    <a-camera position="0 1.6 0"></a-camera>

<!-- Left controller -->
<a-entity
  id="left-controller"
  oculus-touch-controls="hand: left; model: true;"
  raycaster="objects: .interactive"
  line="color: #00ffff; opacity: 0.75"
  static-body="shape: sphere; sphereRadius: 0.02"
  sphere-collider="objects: .grabbable"
  grab
  throw>

  <a-entity
  id="left-hand"
  gltf-model="#left-hand-model"
  position="-0.02 0.03 0.03"
  rotation="180 0 110"
  scale="0.85 0.85 0.85"
  finger-grip="controller: #left-controller">
</a-entity>

</a-entity>

<!-- Right controller -->
<a-entity
  id="right-controller"
  oculus-touch-controls="hand: right; model: true;"
  raycaster="objects: .interactive"
  line="color: #00ffff; opacity: 0.75"
  static-body="shape: sphere; sphereRadius: 0.02"
  sphere-collider="objects: .grabbable"
  grab
  throw>

  <a-entity
  id="right-hand"
  gltf-model="#right-hand-model"
  position="0.02 0.03 0.03"
  rotation="0 0 -70"
  scale="0.85 0.85 0.85"
  finger-grip="controller: #right-controller">
</a-entity>

</a-entity>


<!-- Interactable Ball & Ground-->

  <a-sphere
    class="grabbable"
    grabbable
    position="0 1 -2"
    radius="0.3"
    color="red"
    dynamic-body="shape: sphere; sphereRadius: 0.3"
    shadow="cast: true; receive: true">
  </a-sphere>

  <a-plane
    position="0 0 0"
    rotation="-90 0 0"
    width="20"
    height="20"
    color="#777"
    shadow="receive: true">
  </a-plane>
  <!-- Physics ground -->
    <a-box
    position="0 -0.05 0"
    width="20"
    height="0.1"
    depth="20"
    visible="false"
    static-body>
    </a-box>


<!-- Lights-->
  <a-light
    type="ambient"
    color="#ffffff"
    intensity="0.5">
  </a-light>

  <a-light
    type="directional"
    position="-3 5 2"
    light="castShadow: true; intensity: 2"
    shadow-camera-visible="true"
    shadow-camera-left="-5"
    shadow-camera-right="5"
    shadow-camera-top="5"
    shadow-camera-bottom="-5"
    shadow-camera-near="0.1"
    shadow-camera-far="20"
    shadow-map-width="4096"
    shadow-map-height="4096">
</a-light>


</a-scene>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
